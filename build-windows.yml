name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'banner_grabber.py'
      - 'test_banner_grabber.py'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get files
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Test the program
        run: python -m unittest -v test_banner_grabber

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Create Windows EXE
        run: python -m PyInstaller --clean --onefile --console --name Banner_Grabber banner_grabber.py

      - name: Check that EXE runs
        shell: pwsh
        run: .\dist\Banner_Grabber.exe --help

      - name: Upload EXE as build artifact
        uses: actions/upload-artifact@v6
        with:
          name: Banner_Grabber_Windows
          path: dist/Banner_Grabber.exe
          if-no-files-found: error

      - name: Add EXE to repository automatically
        shell: pwsh
        run: |
          Copy-Item 'dist/Banner_Grabber.exe' 'Banner_Grabber.exe'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f Banner_Grabber.exe
          ${stagedFiles} = git diff --cached --name-only
          if (${stagedFiles}) {
            git commit -m 'Add Windows EXE'
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
            Write-Host 'Windows EXE is already in the repository'
          }
